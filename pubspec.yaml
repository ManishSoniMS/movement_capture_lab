name: movement_capture_lab
description: Test harness for the movement_capture package.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  movement_capture:
    path: movement_capture
  camera_android: ^0.10.10 # REQUIRED: selects the Camera2 implementation
  camera_platform_interface: ^2.10.0 # to show which implementation is active
  dio: ^5.11.1
  path_provider: ^2.1.6
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.6
  # LAB ONLY, TEMPORARY: Part A go/no-go test (kiosk-08). Never add to movement_capture/.
  uvccamera: 0.0.13
  # LAB ONLY, TEMPORARY (kiosk-08b): plays the quick clip. Same constraint as the package.
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  camera_avfoundation:
    path: third_party/camera_avfoundation
  # LAB ONLY, TEMPORARY: uvccamera 0.0.13 + 2 patches (third_party/uvccamera/PATCHES.md).
  uvccamera:
    path: third_party/uvccamera

flutter:
  uses-material-design: true
