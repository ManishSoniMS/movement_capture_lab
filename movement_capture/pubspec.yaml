name: movement_capture
description: Operator-assisted full-body video capture with live quality checks for kiosk tablets.
version: 0.7.1
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  camera_android: ^0.10.10 # Camera2 implementation; lists USB cameras
  google_mlkit_pose_detection: ^0.16.1
  google_mlkit_face_detection: ^0.15.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.medpredict.movement_capture
        pluginClass: MovementCapturePlugin
      ios:
        pluginClass: MovementCapturePlugin
